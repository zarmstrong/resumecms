services:
  resume:
    build: .
    ports:
      - '4000:4000'
    environment:
      - RESUMECMS_ADMIN_USERNAME=${RESUMECMS_ADMIN_USERNAME:?Set RESUMECMS_ADMIN_USERNAME in your .env file}
      - RESUMECMS_APP_PASSWORD=${RESUMECMS_APP_PASSWORD:?Set RESUMECMS_APP_PASSWORD in your .env file}
      - RESUMECMS_SESSION_SECRET=${RESUMECMS_SESSION_SECRET:-please-change-this-session-secret}
      - PORT=4000
      - RESUMECMS_DATA_DIR=/data
      - RESUMECMS_CAPTCHA_PROVIDER=${RESUMECMS_CAPTCHA_PROVIDER:-}
      - RESUMECMS_TURNSTILE_SITE_KEY=${RESUMECMS_TURNSTILE_SITE_KEY:-}
      - RESUMECMS_TURNSTILE_SECRET_KEY=${RESUMECMS_TURNSTILE_SECRET_KEY:-}
      - RESUMECMS_RECAPTCHA_SITE_KEY=${RESUMECMS_RECAPTCHA_SITE_KEY:-}
      - RESUMECMS_RECAPTCHA_SECRET_KEY=${RESUMECMS_RECAPTCHA_SECRET_KEY:-}
    volumes:
      - resume-data:/data
    restart: unless-stopped

  # Maintainer/contributor tooling only — regenerates templates/presets/*/preview.png.
  # Excluded from a normal `docker compose up` (the "tools" profile), and
  # fully isolated from the "resume" service above: its own ephemeral data
  # dir (not the resume-data volume), no published port, and the only host
  # path it touches is a bind mount of ./templates so the images land back
  # in the repo. Run explicitly with:
  #   docker compose --profile tools run --rm resume-preview
  # render-template-previews.mjs boots its own throwaway server internally
  # (its own ephemeral data dir + port, regardless of the container's own
  # env), so this service needs no environment beyond the image's defaults.
  resume-preview:
    build: .
    profiles: ['tools']
    # The "resume" service above runs as non-root for defense-in-depth
    # around Chromium (see Dockerfile) — that doesn't matter for this
    # throwaway local tool, and running as root here avoids write-permission
    # friction on the ./templates bind mount across different host setups.
    user: root
    volumes:
      - ./templates:/app/templates
    command: ['node', 'scripts/render-template-previews.mjs']

volumes:
  resume-data:
