version: 2
# PR titles must be Conventional Commits (CI's pr-title job, see
# release.yml). An npm bump ships in the image, so it's a fix and makes a
# patch release; an Actions bump doesn't, so it's ci.
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
