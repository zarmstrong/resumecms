name: Release

# release-please keeps a release PR open against main, built from the
# Conventional Commit titles of the PRs merged since the last release (CI's
# `pr-title` job enforces them). Merging that PR tags vX.Y.Z, creates the
# GitHub release, and the `docker` job below publishes the image to Docker
# Hub. Both happen in this one workflow because a release created with
# GITHUB_TOKEN doesn't trigger other workflows.
#
# Secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  Docker Hub login (an access token
#                                        with Read & Write scope).
#   RELEASE_PLEASE_TOKEN (optional)      A fine-grained PAT (Contents and
#                                        Pull requests: read and write).
#                                        A PR opened with GITHUB_TOKEN gets
#                                        no CI run, so without this the
#                                        release PR never gets `ci-passed`
#                                        and can't merge into main.
#
# Run it by hand (Actions → Release → Run workflow) with an existing tag to
# publish that release's image again, e.g. after a failed push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (e.g. v1.2.0)
        required: true

permissions:
  contents: read

# A group keeps only one pending run and cancels an older pending one, so
# pushes and manual runs queue separately: a manual run must never cancel a
# push waiting to cut a release, nor a push drop a requested re-publish.
# (A push replacing a pending push is harmless: the next run still finds the
# merged release PR.)
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/zarmstrong/resumecms

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: docker image
    needs: release-please
    # always() so a manual run, where release-please is skipped, gets here.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    steps:
      - id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Not a release tag: '$TAG'"
            exit 1
          fi
          # Only the newest release moves latest, X and X.Y, so publishing
          # an older one again never rolls them back.
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "newest=$([ "$TAG" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }},enable=${{ steps.tag.outputs.newest }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.tag }},enable=${{ steps.tag.outputs.newest }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.newest }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
