name: templates

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'client/src/resume/templateRegistry.js'
      - 'scripts/validate-templates.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate templates/ metadata
        run: node scripts/validate-templates.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client (catches broken template components)
        run: |
          cd client
          npm ci
          npm run build
